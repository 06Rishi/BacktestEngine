# nsebt configuration. Relative paths are resolved against this file's folder.

paths:
  bloomberg_root: dataextracted/DE        # the unzipped Bloomberg extract (contains data/)
  nse_raw: data/nse/raw                   # downloaded NSE files, never modified
  nse_reference: data/nse/reference       # dated copies of EQUITY_L, symbolchange, Nifty 500 list
  store: data/store                       # canonical parquet store built from the raw files
  mergers: mergers.csv                    # manual share-conversion table: mergers, schemes, relistings
  lifecycle_overrides: lifecycle_overrides.csv   # sourced outcomes for securities that stopped trading
  ca_overrides: ca_overrides.csv          # sourced factors for corporate actions the automatic rules get wrong
  reports: reports
  logs: logs

nse:
  backfill_start: 2016-08-29              # first day of the Bloomberg history
  politeness:
    min_interval: 0.5                     # seconds between requests
    jitter: 0.3
    retries: 4
    backoff: 4.0
    cooldown_after: 6
    cooldown: 600
    max_cooldowns: 3
  # NSE occasionally trades on a weekend (Diwali Muhurat, Union Budget, special sessions).
  # These were found in the Bloomberg calendar. Weekends after `try_weekends_after`
  # are always tried, because there is no other calendar for them yet.
  weekend_sessions:
    - 2016-10-30
    - 2019-10-27
    - 2020-02-01
    - 2020-11-14
    - 2023-11-12
    - 2024-01-20
    - 2024-03-02
    - 2024-05-18
    - 2025-02-01
    - 2026-02-01
  try_weekends_after: 2026-08-28

backup:
  # Everything that cannot be rebuilt from code. The parquet store is rebuilt by `nsebt build`.
  include:
    - data/nse/raw
    - data/nse/reference
    - dataextracted/DE/data          # the Bloomberg extract (irreplaceable)
    - journal                        # trade journal (Phase 7)
    - bbg_overrides.csv
    - mergers.csv
    - lifecycle_overrides.csv
    - ca_overrides.csv
    - config.yaml
    - reports/runs                   # daily update reports
  destinations: []                   # e.g. /run/media/<you>/drive or a Google Drive folder

costs:
  # Zerodha equity delivery. Source: Zerodha charges page and support article
  # "What are transaction charges and how do NSE, BSE, and MCX calculate it?", checked 2026-11-13.
  # The NSE transaction charge includes the IPFT charge: do not add IPFT separately.
  brokerage: 0.0                 # ₹ per order
  stt_pct: 0.1                   # % of value, buy and sell
  transaction_pct: 0.00307       # % of value, buy and sell (NSE, includes IPFT)
  sebi_per_crore: 10.0           # ₹ per crore, buy and sell
  gst_pct: 18.0                  # % of brokerage + transaction + SEBI
  stamp_pct_buy: 0.015           # % of value, buy only (uniform since July 2020; applied to all history)
  dp_per_scrip_sell_day: 15.34   # ₹ once per stock per sell day
  slippage_bps_buy: 10.0         # moves the fill price
  slippage_bps_sell: 10.0

corporate_actions:
  # Position ledger (amendments 2.3). Signals never read it; it changes P&L and cash timing only.
  dividends: receivable          # receivable | instant | ignore
  dividend_pay_lag_days: 30      # calendar days (Companies Act limit for paying a declared dividend)
  rights: sell_entitlement       # sell_entitlement | subscribe | ignore
  rights_realise_lag_days: 15    # trading days (about the entitlement trading window)
  demerger: receivable           # receivable | table_then_receivable
  demerger_realise_lag_days: 60  # calendar days
  merger: convert_then_sell      # convert_then_sell | convert_and_hold
  delisting: haircut(50)         # haircut(N) | last_close | zero: share of the last close received
  grace_days: 60                 # trading days a security that stopped for good is held, then exits (delisted, suspended, unknown)

eligibility:
  # Entry eligibility (amendment A4) and index removal (2.5). Data up to the decision close only.
  min_price: 10.0                # ₹, raw close
  min_adv: 10000000.0            # ₹ 1 crore, average traded value
  adv_days: 20                   # sessions in the average (a session with no trade counts as zero)
  on_universe_exit: hold         # hold | sell

research:
  holdout_start: 2022-01-01      # 2022 onward is out-of-sample; locked until a run passes --final (A8, M4.3)
