[project]
name = "nsebt"
version = "0.2.0"
description = "NSE research and backtesting platform: data pipeline, indicators, strategies, backtests, scanner"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "requests>=2.31",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
query = ["duckdb>=1.0"]
reference = ["TA-Lib>=0.6"]

[project.scripts]
nsebt = "nsebt.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["nsebt"]
include = ["nsebt*"]

[tool.pytest.ini_options]
testpaths = ["nsebt/tests"]

[tool.uv]
default-groups = []
